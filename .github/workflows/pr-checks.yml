name: 'PR Checks'

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to run checks on'
        required: true
        type: string
      skip_build_test:
        description: 'Skip the build test job (saves ~45 min)'
        type: boolean
        required: false
        default: false
  pull_request:
    types: [opened, synchronize, edited, closed, ready_for_review]
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  checks: write
  id-token: write

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  # Cancel in-progress runs when PR is closed (merged or manually closed)
  cancel-if-closed:
    name: Cancel if PR closed
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - run: echo "PR closed, cancelling in-progress runs via concurrency."

  # Job 1: Code quality — TypeScript typecheck + unit tests
  code-quality:
    name: Code Quality
    if: github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && github.event.pull_request.draft == false)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve PR context
        uses: ./.github/actions/checkout-pr
        with:
          pr_number: ${{ inputs.pr_number }}
          github_token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: npm run postinstall || true

      - name: TypeScript typecheck
        run: bunx tsc --noEmit

      - name: Run unit tests
        run: bunx vitest run

  # Job 2: Unit tests (Windows x64)
  unit-tests:
    name: Unit Tests (windows-2022)
    if: github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && github.event.pull_request.draft == false)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve PR context
        uses: ./.github/actions/checkout-pr
        with:
          pr_number: ${{ inputs.pr_number }}
          github_token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Disable Windows Defender
        shell: pwsh
        continue-on-error: true
        run: |
          try { Set-MpPreference -DisableRealtimeMonitoring $true } catch { Write-Host "::warning::Failed to disable real-time monitoring: $_" }
          try { Add-MpPreference -ExclusionPath "${{ github.workspace }}" } catch { Write-Host "::warning::Failed to add exclusion path: $_" }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: npm run postinstall || true

      - name: Run unit tests
        run: bunx vitest run

  # Job 3: Coverage test (Linux, non-blocking)
  coverage-tests:
    name: Coverage Test
    if: github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve PR context
        uses: ./.github/actions/checkout-pr
        with:
          pr_number: ${{ inputs.pr_number }}
          github_token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: npm run postinstall || true

      - name: Run coverage tests
        id: coverage
        continue-on-error: true
        run: bun run test:coverage

      - name: Upload coverage artifacts
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

  # Job 4: i18n check (warning-only)
  i18n-check:
    name: I18n Check
    if: github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: npm run postinstall || true

      - name: Run i18n validation (warning-only)
        id: i18n
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-i18n.js 2>&1 | tee i18n-check.log

      - name: Publish i18n summary
        if: always()
        shell: bash
        run: |
          echo "## i18n validation" >> $GITHUB_STEP_SUMMARY
          if grep -q "⚠️" i18n-check.log; then
            echo "Missing/incomplete translations found. Please review warnings below." >> $GITHUB_STEP_SUMMARY
          else
            echo "No i18n warnings detected." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>i18n log</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat i18n-check.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

  # Job 5: Build test (Windows x64 only)
  build-test:
    name: Build Test (windows-x64)
    if: github.event.action != 'closed' && github.event.pull_request.draft == false && inputs.skip_build_test != true
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve PR context
        uses: ./.github/actions/checkout-pr
        with:
          pr_number: ${{ inputs.pr_number }}
          github_token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: npm run postinstall || true

      - name: Disable Windows Defender
        shell: pwsh
        continue-on-error: true
        run: |
          try { Set-MpPreference -DisableRealtimeMonitoring $true } catch { Write-Host "::warning::$_" }
          try { Add-MpPreference -ExclusionPath "${{ github.workspace }}" } catch { Write-Host "::warning::$_" }

      - name: Get Electron version
        id: electron-version
        shell: bash
        run: |
          ELECTRON_VERSION=$(node -p "require('./package.json').devDependencies.electron.replace(/[\^~]/g, '')")
          echo "version=$ELECTRON_VERSION" >> $GITHUB_OUTPUT

      - name: Cache Electron artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: electron-cache-windows-x64-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            electron-cache-windows-x64-

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'

      - name: Build (Windows x64)
        shell: pwsh
        run: node scripts/build-with-builder.js x64 --win --x64
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022
          WindowsTargetPlatformVersion: 10.0.19041.0
          CI: true
          GH_TOKEN: ${{ github.token }}

      - name: Verify artifacts and smoke install
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path out -Filter "Headmaster-*-win-*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "No Windows installer found in out/" }
          Write-Host "Installer: $($installer.FullName)"
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -NoNewWindow
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\Headmaster\Headmaster.exe",
            "$env:ProgramFiles\Headmaster\Headmaster.exe",
            "$env:ProgramFiles(x86)\Headmaster\Headmaster.exe"
          )
          $installedExe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $installedExe) { throw "Silent install finished but app executable not found" }
          Write-Host "Installed: $installedExe"

  # Job 6: Test release scripts (fast, no build required)
  release-script-test:
    name: Release Script Test
    if: github.event.action != 'closed' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create mock build artifacts
        shell: bash
        run: bash scripts/create-mock-release-artifacts.sh build-artifacts

      - name: Run prepare-release-assets script
        shell: bash
        env:
          MOCK_VERSION: '1.0.0'
        run: bash scripts/prepare-release-assets.sh build-artifacts release-assets

      - name: Validate script output
        shell: bash
        run: bash scripts/verify-release-assets.sh release-assets
